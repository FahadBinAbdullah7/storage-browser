name: Release

# Pushing a tag like v1.0.0 builds the installers and publishes them to GitHub Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Create exactly one release first so the Mac and Windows builds don't each make their own.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create a single release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          for id in $(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\") | .id"); do
            gh api -X DELETE "repos/$REPO/releases/$id"
          done
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "Cloudpeek $TAG" --notes "Installers for Windows and macOS. See the README for install steps."

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Optional: bake the app's Google Client ID into the build from repository secrets, so users
      # only click "Sign in with Google". Skipped when the secrets are not set.
      - name: Add Google Client ID
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then
            node -e "require('fs').writeFileSync('electron/oauth.json', JSON.stringify({google:{clientId:process.env.GOOGLE_CLIENT_ID,clientSecret:process.env.GOOGLE_CLIENT_SECRET||''}}))"
            echo "Google Client ID added to this build"
          fi
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # Only make the release visible once every installer and update file is uploaded,
  # so installed apps never see a half-finished release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest
