name: Release

# Pushing a tag like v1.0.0 builds the installers and publishes them to GitHub Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Create exactly one release first so the Mac and Windows builds don't each make their own.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create a single release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          for id in $(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\") | .id"); do
            gh api -X DELETE "repos/$REPO/releases/$id"
          done
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "Cloudpeek $TAG" --notes "Installers for Windows and macOS. See the README for install steps."

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Optional: default bucket names for keys that cannot list buckets (repository secret DEFAULT_BUCKETS).
      - name: Add default bucket names
        shell: bash
        env:
          DEFAULT_BUCKETS: ${{ secrets.DEFAULT_BUCKETS }}
        run: |
          if [ -n "$DEFAULT_BUCKETS" ]; then
            node -e "require('fs').writeFileSync('electron/config.local.json', JSON.stringify({buckets: process.env.DEFAULT_BUCKETS.split(/[,\\s]+/).filter(Boolean)}))"
            echo "Default bucket names added to this build"
          fi
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # Only make the release visible once every installer and update file is uploaded,
  # so installed apps never see a half-finished release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest
